name: mauricio-erpnext-e2e

services:
  backend:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        ls -1 apps > sites/apps.txt
        bench set-config -g db_host $$DB_HOST
        bench set-config -gp db_port $$DB_PORT
        bench set-config -g redis_cache "redis://$$REDIS_CACHE"
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        wait-for-it db:3306 -t 120
        wait-for-it redis-cache:6379 -t 120
        wait-for-it redis-queue:6379 -t 120
        if [ ! -d sites/frontend ]; then
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin \
            --db-host=db \
            --db-root-username=root --db-root-password=$$DB_PASSWORD \
            --set-default frontend
        fi
        if ! bench --site frontend list-apps | grep -q '^erpnext'; then
          bench --site frontend install-app erpnext
        fi
        bench --site frontend set-config allow_cors '["http://127.0.0.1:5173", "http://localhost:5173"]'
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    networks: [frappe_network]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [db-data:/var/lib/mysql]

  frontend:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports: ["${ERPNEXT_PORT:-8080}:8080"]
    depends_on: [backend, websocket]

  queue-long:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: [sites:/home/frappe/frappe-bench/sites, logs:/home/frappe/frappe-bench/logs]
    depends_on: [configurator]

  queue-short:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: [sites:/home/frappe/frappe-bench/sites, logs:/home/frappe/frappe-bench/logs]
    depends_on: [configurator]

  redis-queue:
    image: redis:6.2-alpine
    networks: [frappe_network]
    volumes: [redis-queue-data:/data]

  redis-cache:
    image: redis:6.2-alpine
    networks: [frappe_network]

  scheduler:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    command: ["bench", "schedule"]
    volumes: [sites:/home/frappe/frappe-bench/sites, logs:/home/frappe/frappe-bench/logs]
    depends_on: [configurator]

  websocket:
    image: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.52.1}
    networks: [frappe_network]
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: [sites:/home/frappe/frappe-bench/sites, logs:/home/frappe/frappe-bench/logs]
    depends_on: [configurator]

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
